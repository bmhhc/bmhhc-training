const ES_Q=[{"text":"¿Quién debe cumplir las leyes de HIPAA?","choices":["Los médicos","Los médicos y todos los proveedores de atención médica","Solo los supervisores y otros administradores","Todas las anteriores"],"explanation":"Las leyes de HIPAA se aplican a los médicos y a todos los proveedores de atención médica que manejan información médica protegida."},{"text":"PHI significa Información Médica Personal (Personal Health Information)","choices":["Verdadero","Falso"],"explanation":"PHI significa Información Médica Protegida (Protected Health Information), no Información Médica Personal."},{"text":"Ejemplos de PHI incluyen:","choices":["Nombre, dirección, fecha de nacimiento","Resultados de pruebas, expedientes médicos, diagnóstico","Registros de facturación, autorizaciones de referencia","Todas las anteriores"],"explanation":"Todos estos son ejemplos de Información Médica Protegida que debe mantenerse confidencial."},{"text":"¿Qué forma(s) de PHI exigen la ley estatal y federal que permanezcan confidenciales?","choices":["Escrita","Hablada","Electrónica","Todas las anteriores"],"explanation":"Todas las formas de PHI (escrita, hablada y electrónica) deben permanecer confidenciales según la ley estatal y federal."},{"text":"Como tengo acceso a información confidencial de pacientes como parte de mi trabajo, puedo consultar el expediente de cualquier persona aunque no sea mi paciente, siempre que mantenga la información para mí","choices":["Verdadero","Falso"],"explanation":"Solo puede acceder a la información de un paciente si es necesario para sus funciones laborales. El acceso no autorizado viola HIPAA."},{"text":"Usted puede proteger la información del paciente mediante:","choices":["Proteger la información verbal o escrita","Usar buenas prácticas de seguridad informática","Reportar incidentes de seguridad sospechosos","Todas las anteriores"],"explanation":"Todos estos métodos son importantes para proteger la información del paciente."},{"text":"Los pacientes tienen derecho a ser informados sobre las opciones de atención médica que tienen","choices":["Verdadero","Falso"],"explanation":"Los pacientes tienen derecho al consentimiento informado y se les deben comunicar sus opciones de atención médica."},{"text":"¿Cuáles de las creencias del paciente deben respetarse?","choices":["Culturales","Espirituales","Psicosociales","Todas las anteriores"],"explanation":"Todas las creencias del paciente (culturales, espirituales y psicosociales) deben respetarse como parte de la atención centrada en el paciente."},{"text":"¿Cómo se debe informar al paciente sobre sus opciones de atención?","choices":["Oralmente","Por escrito","No es necesario informarle","Tanto A como B"],"explanation":"Se puede informar a los pacientes de forma oral y por escrito para asegurar que comprendan sus opciones de atención."},{"text":"El paciente:","choices":["Debe participar en tratamientos experimentales","Nunca puede participar en tratamientos experimentales","Puede rechazar tratamientos experimentales y/o participar en investigaciones","No puede rechazar el tratamiento"],"explanation":"Los pacientes tienen derecho a decidir si participan en tratamientos experimentales o en investigaciones."},{"text":"¿Qué porcentaje de las personas mayores prefiere permanecer en su propio hogar a medida que envejece?","choices":["30%","50%","75%","90%"],"explanation":"Aproximadamente el 90% de las personas mayores prefiere envejecer en su lugar y permanecer en su propio hogar."},{"text":"¿Cuál de los siguientes NO es fundamental para vivir de forma independiente?","choices":["Fuerza física","Salir de vacaciones","Preparar alimentos","Transporte fuera del hogar"],"explanation":"Aunque las vacaciones son agradables, no son fundamentales para mantener una vida independiente, como lo son la preparación de alimentos y el transporte."},{"text":"¿Cuál es la parte más importante de la filosofía de vida independiente?","choices":["Los pacientes toman sus propias decisiones","Participación activa en la comunidad","Selección de preferencias de comida"],"explanation":"El núcleo de la vida independiente es la autonomía del paciente y su capacidad de tomar sus propias decisiones."},{"text":"¿Qué significa ADL?","choices":["Actividades de la Vida Diaria (Activities of Daily Living)","Lente de Dispositivo Autónomo","LED Digital Automático"],"explanation":"ADL significa Actividades de la Vida Diaria, que son las tareas básicas de cuidado personal."},{"text":"¿Cuál es el término técnico para caminar?","choices":["Ambulancia","Deambular","Anticipar"],"explanation":"Deambular es el término médico para caminar o desplazarse."},{"text":"¿Cuál de los siguientes es una IADL?","choices":["Manejar las finanzas","Transporte","Hacer compras","Todas las anteriores"],"explanation":"Todas estas son Actividades Instrumentales de la Vida Diaria (IADL), que son más complejas que las ADL básicas."},{"text":"Las ADL y las IADL son importantes para la vida independiente","choices":["Verdadero","Falso"],"explanation":"Tanto las ADL como las IADL son indicadores esenciales de la capacidad de una persona para vivir de forma independiente."},{"text":"¿Cuál de los siguientes es una ADL?","choices":["Usar el control remoto","Estornudar","Bañarse"],"explanation":"Bañarse es una Actividad de la Vida Diaria básica. Usar el control remoto y estornudar no son ADL."},{"text":"¿Qué ayudan a evaluar las ADL y las IADL?","choices":["Inteligencia","Función","Fuerza"],"explanation":"Las ADL y las IADL ayudan a evaluar la capacidad funcional de una persona para cuidarse a sí misma."},{"text":"¿Cuáles son algunas señales que podrían indicar un deterioro de la salud?","choices":["Empeoramiento de la memoria","Incapacidad para comunicarse","Deterioro de la percepción visual","Todas las anteriores"],"explanation":"Todas estas pueden ser señales de un deterioro de la salud que requieren atención."},{"text":"Volverse inexpresivo y sin emociones es motivo de preocupación","choices":["Verdadero","Falso"],"explanation":"La falta de expresión emocional puede indicar depresión u otros problemas de salud."},{"text":"La dificultad para comer puede observarse a través de:","choices":["Sorberse la nariz","Dificultad para tragar","Jugar con los cubiertos"],"explanation":"La dificultad para tragar (disfagia) es una señal grave que indica problemas para comer."},{"text":"¿Qué tipo de pacientes tiene mayor riesgo de presentar señales degenerativas?","choices":["Jóvenes","De mediana edad","Ancianos"],"explanation":"Los pacientes ancianos tienen el mayor riesgo de presentar señales de deterioro de la salud."},{"text":"El habla arrastrada es un indicador de deterioro en la","choices":["Comunicación","Respiración","Planificación"],"explanation":"El habla arrastrada indica deterioro en la capacidad de comunicación y puede ser señal de afecciones graves."},{"text":"Su cliente está almorzando cuando usted llega a su casa y usted debe tomarle los signos vitales y ayudarle a entrar y salir de la bañera. ¿Qué debe hacer?","choices":["Decirle que termine de almorzar más tarde porque usted tiene 3 pacientes más hoy","Dejar que termine de almorzar, y luego terminar el baño y tomar los signos vitales al final","Dejar que termine de almorzar, descansar más de 10 minutos, tomar los signos vitales y luego bañarlo"],"explanation":"Los signos vitales deben tomarse después de dejar tiempo para la digestión y el descanso, para obtener lecturas precisas; luego se puede realizar el baño."},{"text":"Una paciente le dice que está muy molesta con usted y le exige el nombre del supervisor para llamar y reportarlo. Usted debe:","choices":["Decirle que está haciendo lo mejor que puede","Salir de su casa e ir con el siguiente paciente","Negarse a volver a verla","Darle el nombre y el número de teléfono del supervisor"],"explanation":"Los pacientes tienen derecho a presentar quejas. Usted debe proporcionar la información de contacto del supervisor de manera profesional."},{"text":"Usted debe tomar personalmente el comportamiento difícil de un paciente","choices":["Verdadero","Falso"],"explanation":"El comportamiento difícil suele deberse a la enfermedad, la pérdida de control o la frustración, no a problemas personales con usted."},{"text":"La frustración de los pacientes a menudo proviene de","choices":["Que el teléfono no funcione","No poder comer su comida favorita","La pérdida de control sobre sus vidas"],"explanation":"La frustración del paciente suele provenir de sentir que ha perdido el control sobre su propia vida y sus decisiones."},{"text":"¿Qué debe decir en respuesta a la frustración?","choices":["\"¿Qué te hace sentir tan mal?\"","\"No es nada importante.\"","\"Esto realmente no importa.\""],"explanation":"Hacer preguntas abiertas demuestra empatía y ayuda a identificar el origen de la frustración."},{"text":"Usted debe darle al paciente la oportunidad de tener el control","choices":["Verdadero","Falso"],"explanation":"Permitir que los pacientes elijan y tengan control ayuda a mantener su dignidad y reduce la frustración."},{"text":"Cambiar la ropa de cama de un cliente con sarpullido sin usar guantes, ¿qué forma de transmisión es?","choices":["Por el aire","Por la sangre","Por contacto","Por gotas"],"explanation":"El contacto directo con superficies contaminadas sin guantes es transmisión por contacto."},{"text":"Mantener un ventilador encendido y la puerta abierta cuando un cliente tiene culebrilla (herpes zóster), ¿qué forma de transmisión es?","choices":["Por el aire","Por la sangre","Por contacto","Por gotas"],"explanation":"La culebrilla puede propagarse mediante partículas en el aire, por lo que la circulación de aire aumenta el riesgo de transmisión aérea."},{"text":"Una clienta con un resfriado estornuda sobre otras personas en su mesa, ¿qué forma de transmisión es?","choices":["Por el aire","Por la sangre","Por contacto","Por gotas"],"explanation":"Los estornudos propagan gérmenes mediante gotas grandes que viajan distancias cortas."},{"text":"Limpiar orina del piso sin guantes, ¿qué forma de transmisión es?","choices":["Por el aire","Por la sangre","Por contacto","Por gotas"],"explanation":"El contacto directo con fluidos corporales sin equipo de protección es transmisión por contacto."},{"text":"La buena técnica de lavado de manos es importante porque:","choices":["Previene la propagación de gérmenes","Lo exige el departamento de salud","Es bueno para el ánimo del paciente"],"explanation":"El lavado de manos es la forma más eficaz de prevenir la propagación de gérmenes infecciosos."},{"text":"La zona perineal se lava:","choices":["De adelante hacia atrás","De atrás hacia adelante","No importa"],"explanation":"Lavar de adelante hacia atrás previene la contaminación y reduce el riesgo de infección."},{"text":"Al manejar ropa de cama y ropa sucia, lo mejor es:","choices":["Poner la ropa de cama y la ropa sucia en el piso","Sacudir la ropa de cama y la ropa antes de lavarlas","Colocar la ropa de cama y la ropa sucia en un cesto de ropa o en una bolsa de plástico hasta que puedan lavarse"],"explanation":"Contener la ropa sucia previene la contaminación y la propagación de gérmenes."},{"text":"Respecto al papel del asistente de salud en el hogar para reducir la propagación de gérmenes, el asistente haría todo lo siguiente excepto:","choices":["Cubrirse la nariz y la boca al estornudar o toser","Ir a trabajar aunque esté enfermo","Lavarse las manos después de manipular artículos sucios como ropa de cama, ropa, basura, etc.","Para protegerse, limpiar y cubrir los cortes y las heridas en la piel"],"explanation":"Trabajar estando enfermo propaga gérmenes a pacientes vulnerables. Quédese en casa cuando esté enfermo."},{"text":"¿Cuál es el método más eficaz para prevenir enfermedades?","choices":["Mascarilla","Lavar la ropa","Higiene de manos"],"explanation":"La higiene de manos es el método individual más eficaz para prevenir la transmisión de enfermedades."},{"text":"¿Aproximadamente cuánto tiempo debe lavarse las manos?","choices":["5-10 segundos","20-30 segundos","40-60 segundos","80-120 segundos"],"explanation":"Un lavado de manos adecuado requiere de 40 a 60 segundos para eliminar los gérmenes de forma eficaz."},{"text":"Los guantes deben usarse en la(s) siguiente(s) situación(es):","choices":["Al tocar sangre","Al interactuar con fluidos corporales","Al tocar piel no intacta","Todas las anteriores"],"explanation":"Los guantes protegen contra todas las formas de materiales potencialmente infecciosos."},{"text":"¿Quién debe cumplir con las prácticas de control de infecciones?","choices":["Los proveedores de atención","Los pacientes","Los visitantes","Todos los anteriores"],"explanation":"Todas las personas en el entorno de atención médica deben seguir las prácticas de control de infecciones."},{"text":"¿Cuál suele ser el lugar con más gérmenes en un hogar?","choices":["Sótano","Cocina","Baños","Dormitorios"],"explanation":"Los baños tienen la mayor concentración de gérmenes debido a la humedad y a las funciones corporales."},{"text":"¿Qué desencadena enfermedades relacionadas con el asma?","choices":["Polvo","Caspa de mascotas","Moho","Todos los anteriores"],"explanation":"Todos estos factores ambientales pueden desencadenar ataques de asma."},{"text":"Las cucarachas transportan numerosas bacterias y parásitos con gérmenes que pueden causar","choices":["VIH","Tuberculosis","Lupus","Gastroenteritis"],"explanation":"Las cucarachas transportan bacterias que pueden causar gastroenteritis y otras enfermedades digestivas."},{"text":"Un entorno físico caótico puede fomentar una dieta poco saludable:","choices":["Verdadero","Falso"],"explanation":"Los entornos desorganizados pueden llevar a malas elecciones de alimentos y hábitos alimenticios poco saludables."},{"text":"¿Qué es único del entorno de atención en el hogar en cuanto a las emergencias?","choices":["La interacción con el paciente","La preparación de comidas","Cada lugar es diferente","La independencia del cliente"],"explanation":"Los entornos de atención en el hogar varían mucho, por lo que requieren una planificación de emergencias flexible para cada lugar."},{"text":"Un corte de energía se consideraría una emergencia","choices":["Verdadero","Falso"],"explanation":"Los cortes de energía pueden ser emergencias, especialmente para pacientes que dependen de equipo médico."},{"text":"Los planes de emergencia no se basan en su región específica","choices":["Verdadero","Falso"],"explanation":"Los planes de emergencia deben adaptarse a los riesgos regionales, como huracanes, terremotos o clima extremo."},{"text":"¿Cuáles son algunas consideraciones para un plan de emergencia?","choices":["Suministros","Servicios públicos","Transporte","Todas las anteriores"],"explanation":"La planificación integral de emergencias incluye todos estos elementos críticos."},{"text":"¿Cuál es la fase más importante durante una respuesta de emergencia?","choices":["Planificación","Primeros pasos","Recuperación"],"explanation":"Los primeros pasos de la respuesta son críticos para la seguridad y para prevenir más daños."},{"text":"La educación del cliente es un factor a considerar en su respuesta","choices":["Verdadero","Falso"],"explanation":"Educar a los clientes sobre los procedimientos de emergencia asegura que puedan responder adecuadamente."},{"text":"Si usted sabe o sospecha que hay abuso o negligencia hacia una persona mayor, usted debe primero:","choices":["Confrontar al miembro del personal o familiar que sospecha que está cometiendo el abuso","Llamar a la agencia estatal que recibe reportes de abuso","Reportarlo a su supervisor"],"explanation":"Siempre reporte primero a su supervisor cualquier sospecha de abuso, quien seguirá los protocolos de reporte adecuados."},{"text":"Algunas causas de abuso y negligencia son:","choices":["El estrés del cuidador","Enfermedad emocional o mental","Consumo de alcohol o drogas","Todas las anteriores"],"explanation":"Todos estos factores pueden contribuir a situaciones de abuso."},{"text":"Amenazar a una persona mayor con castigarla por no hacer lo que usted le dice es:","choices":["Aceptable si se hace con un tono de voz suave","Abuso verbal, y nunca es aceptable","Útil para disciplinar a una persona mayor"],"explanation":"Las amenazas son abuso verbal sin importar el tono y nunca son aceptables."},{"text":"La explotación es una forma de abuso que implica:","choices":["Daño físico","Daño emocional","El mal uso o robo de dinero, propiedades u otros activos financieros"],"explanation":"La explotación financiera implica el mal uso o el robo del dinero o las propiedades de una persona mayor."},{"text":"Algunas buenas formas de ayudar a prevenir el abuso son:","choices":["Educación, consejería y grupos de apoyo","Escuchar, enseñar, habilidades de cuidado y comunicación","Todas las anteriores","Ninguna de las anteriores"],"explanation":"La prevención requiere múltiples enfoques, incluyendo educación, apoyo y comunicación."},{"text":"Los síntomas de posible abuso incluyen los siguientes:","choices":["Demencia","Más tiempo dedicado a leer","Moretones o quemaduras"],"explanation":"Los moretones o quemaduras sin explicación son señales físicas de posible abuso."},{"text":"El uso inadecuado de barandas de cama u otras sujeciones se considera:","choices":["Abuso físico","Violación de derechos","Abuso emocional"],"explanation":"El uso inadecuado de sujeciones viola los derechos y la libertad del paciente."},{"text":"Las características de las personas mayores con probabilidad de sufrir abuso financiero incluyen:","choices":["Pueden estar solas","Pueden tener discapacidades mentales y/o físicas","Pueden haber perdido a alguien recientemente","Todas las anteriores"],"explanation":"Todas estas vulnerabilidades convierten a las personas mayores en objetivos de explotación financiera."},{"text":"¿Cuál de las siguientes NO es una razón por la que las personas mayores son objetivos atractivos para el abuso financiero?","choices":["Las personas mayores pueden sentir vergüenza de acudir a las autoridades","Las personas mayores suelen tener más riqueza que las más jóvenes","Las personas mayores visitan las instituciones financieras mucho más que los adultos jóvenes","Las personas mayores pueden estar tan debilitadas que es poco probable que actúen contra los perpetradores."],"explanation":"La frecuencia de las visitas al banco no es una razón principal por la que se elige como víctimas a las personas mayores."},{"text":"La explotación financiera puede prevenirse si un abogado de confianza administra los fondos de la persona o si un familiar se encarga de cómo se asignan los fondos","choices":["Verdadero","Falso"],"explanation":"Contar con una supervisión de confianza de las finanzas ayuda a proteger a las personas mayores vulnerables de la explotación."},{"text":"¿Cuál de las siguientes NO es una razón por la que las personas mayores son susceptibles a la desnutrición?","choices":["El metabolismo y el apetito disminuyen con la edad","La densidad ósea disminuye considerablemente","Una menor ingesta calórica significa menos oportunidades de obtener nutrientes","La capacidad del cuerpo para absorber nutrientes (especialmente nutrientes importantes específicos) disminuye con la edad"],"explanation":"Aunque la densidad ósea disminuye con la edad, no es una causa directa de la desnutrición."},{"text":"¿Qué afecta hasta al 15% de los adultos mayores de 60 años?","choices":["Varicela","Malaria","Deficiencia de vitamina B12","Diabetes tipo 2"],"explanation":"La deficiencia de vitamina B12 es común en los adultos mayores y afecta hasta al 15%."},{"text":"Los niveles bajos de ácidos grasos Omega 3 pueden causar","choices":["Pérdida de memoria","Función inmunológica reducida","Insomnio","Tanto A como B"],"explanation":"La deficiencia de Omega 3 puede provocar tanto problemas de memoria como un sistema inmunológico debilitado."},{"text":"La selección de alimentos debe ser baja en","choices":["Grasa","Grasa saturada","Colesterol","Todas las anteriores"],"explanation":"Las dietas saludables deben ser bajas en grasa, grasa saturada y colesterol."},{"text":"Los alimentos de conveniencia deben evitarse","choices":["Verdadero","Falso"],"explanation":"Los alimentos de conveniencia suelen tener mucho sodio, conservantes y pocos nutrientes."},{"text":"La falta de apetito puede explicarse por","choices":["Satisfacción con la comida","Masticación adecuada","Enfermedad","Cambios de humor"],"explanation":"La enfermedad es una causa común de la falta de apetito en los pacientes."},{"text":"El paciente debe participar en la planificación de las comidas","choices":["Verdadero","Falso"],"explanation":"Incluir a los pacientes en la planificación de las comidas respeta su autonomía y sus preferencias."},{"text":"Al presentar los alimentos, estos deben ser:","choices":["Exactamente iguales todos los días","Seleccionados sin importar lo que el paciente encuentre sabroso","Variados y visualmente atractivos"],"explanation":"Una presentación variada y atractiva fomenta una mejor nutrición y alimentación."},{"text":"Reemplace las baterías de las alarmas de humo de batería y de cableado fijo al menos","choices":["Una vez a la semana","Una vez al año","Una vez al mes","Una vez cada 18 meses"],"explanation":"Las baterías de las alarmas de humo deben reemplazarse al menos una vez al año por seguridad."},{"text":"Es peligroso usar pantuflas o calcetines antideslizantes en pisos de madera pulida o baldosas","choices":["Verdadero","Falso"],"explanation":"El calzado antideslizante reduce el riesgo de caídas en superficies resbalosas: es seguro, no peligroso."},{"text":"Reabastezca de combustible un generador","choices":["Mientras está caliente","Solo después de que se haya enfriado","Ya sea mientras está caliente o después de que se haya enfriado","No hay generadores que requieran combustible"],"explanation":"Reabastecer un generador caliente puede causar incendios o explosiones. Siempre espere a que se enfríe."},{"text":"La mayoría de los clientes necesita un baño diario","choices":["Verdadero","Falso"],"explanation":"La frecuencia del baño varía según las necesidades de cada persona. El baño diario no es necesario para todos."},{"text":"Usted debe hacer lo siguiente cuando el cliente se está bañando:","choices":["Respetar su privacidad","Mantener la habitación fría","Buscar los suministros después de que el baño haya comenzado","Poner música a todo volumen"],"explanation":"Respetar la privacidad mantiene la dignidad y garantiza la seguridad durante el baño."},{"text":"Las personas que permanecen en cama tienen mayor riesgo de:","choices":["Úlceras por presión/llagas de cama","SIDA","Hepatitis","Influenza"],"explanation":"El reposo prolongado en cama aumenta el riesgo de úlceras por presión debido a la presión sostenida sobre la piel."},{"text":"Usted debe usar una afeitadora eléctrica en lugar de una navaja de afeitar","choices":["Verdadero","Falso"],"explanation":"Las afeitadoras eléctricas son más seguras y reducen el riesgo de cortes y sangrado."},{"text":"¿Con qué frecuencia deben limpiarse los dientes?","choices":["Tres veces al día","Al menos una vez al día","Una vez cada dos días"],"explanation":"Los dientes deben limpiarse al menos una vez al día, aunque es mejor limpiarlos con más frecuencia."},{"text":"La cantidad de asistencia depende de qué factores","choices":["Edad","Capacidad física","Género","Equilibrio"],"explanation":"El nivel de asistencia necesario depende principalmente de la capacidad física del paciente."},{"text":"A un paciente impredecible se le debe asistir usando","choices":["Asistencia de una persona","Asistencia de dos personas","Aparato mecánico para ponerse de pie"],"explanation":"Los pacientes impredecibles requieren asistencia mecánica para la seguridad tanto del paciente como del cuidador."},{"text":"Asistencia moderada significa que el paciente puede realizar por su cuenta qué porcentaje de la actividad","choices":["25%","50%","75%"],"explanation":"Asistencia moderada significa que el paciente realiza aproximadamente el 50% de la actividad de forma independiente."},{"text":"¿Qué factor es esencial para prevenir caídas?","choices":["Calzado adecuado","Estado de ánimo positivo","Ejercicios de rodilla"],"explanation":"El calzado adecuado con buena tracción es esencial para la prevención de caídas."},{"text":"Una transferencia a una silla de ruedas es qué tipo de asistencia","choices":["Sin asistencia","Una persona","Dos personas","Aparato mecánico para ponerse de pie"],"explanation":"Las transferencias estándar a una silla de ruedas normalmente requieren la asistencia de una persona."},{"text":"Cuando alguien tiene un accidente","choices":["Avergonzarlo","Enojarse con él","Mantener la calma y tranquilizarlo"],"explanation":"Mantener la calma y tranquilizar a la persona conserva su dignidad y reduce su angustia."},{"text":"¿Cuántos vasos de líquido deben consumirse cada día?","choices":["1-2","3-4","6-8","10-12"],"explanation":"Los adultos deben consumir de 6 a 8 vasos de líquido al día para una hidratación adecuada."},{"text":"El estreñimiento puede reducirse con alimentos ricos en fibra","choices":["Verdadero","Falso"],"explanation":"Los alimentos ricos en fibra favorecen la regularidad intestinal y reducen el estreñimiento."},{"text":"Las sillas sanitarias (inodoros portátiles) pueden limpiarse con","choices":["Limpiadores domésticos","Cloro","Jugo de arándano"],"explanation":"Los limpiadores domésticos comunes son apropiados para limpiar las sillas sanitarias."},{"text":"¿Cuáles son las diferentes formas de medicamento?","choices":["Oral","Tópica","Nasal","Todas las anteriores"],"explanation":"Los medicamentos vienen en muchas formas, incluyendo oral, tópica, nasal y otras."},{"text":"El individuo debe realizar _ del procedimiento tanto como sea posible","choices":["Nada","Lo menos","Lo más"],"explanation":"Para fomentar la independencia, los pacientes deben hacer todo lo que puedan de manera segura."},{"text":"En esta situación el paciente tiene el","choices":["Derecho a portar armas","Derecho de reunión","Derecho a la privacidad"],"explanation":"Los pacientes tienen derecho a la privacidad durante los procedimientos de cuidado personal."},{"text":"Nunca se necesita una licencia para administrar una receta médica","choices":["Verdadero","Falso"],"explanation":"Administrar medicamentos recetados requiere capacitación y autorización adecuadas."},{"text":"Antes de administrar cualquier cosa usted debe","choices":["Llamar a la compañía farmacéutica","Revisar la fecha de vencimiento del medicamento","Preguntarle al paciente cuáles son los procedimientos normales","No realizar higiene de manos"],"explanation":"Siempre revise las fechas de vencimiento de los medicamentos antes de administrarlos, por la seguridad del paciente."},{"text":"¿Qué dispositivo se usa para ayudar a un paciente que necesita ponerse de pie desde la posición sentada?","choices":["Cuerda","Velcro","Trampolín","Cinturón de marcha (cinturón de transferencia)"],"explanation":"Un cinturón de marcha brinda apoyo seguro al ayudar a los pacientes a ponerse de pie o a caminar."},{"text":"Nunca haga que un paciente le rodee la cintura con los brazos; en su lugar, haga que le rodee el cuello con los brazos","choices":["Verdadero","Falso"],"explanation":"Rodear el cuello con los brazos es peligroso. Los pacientes nunca deben agarrarse del cuello ni de la cintura del cuidador."},{"text":"Si el paciente tiene debilidad en un lado del cuerpo (por ejemplo, debido a un ACV o derrame cerebral), coloque la silla de ruedas en","choices":["El lado fuerte","El lado débil","No importa, cualquier lado está bien","No se debe usar una silla de ruedas si un paciente tiene debilidad en un lado del cuerpo"],"explanation":"Coloque la silla de ruedas del lado fuerte para que el paciente pueda usar su lado más fuerte en las transferencias."},{"text":"¿Cuándo debe administrar los medicamentos a un paciente?","choices":["Tres horas después de prepararlos","24 horas después de prepararlos","Solo un médico puede administrar medicamentos","Inmediatamente después de prepararlos"],"explanation":"Los medicamentos deben administrarse inmediatamente después de prepararlos para garantizar la exactitud y la seguridad."},{"text":"Verifique la identidad de la persona usando","choices":["Solo un identificador","Dos identificadores","Use su propio criterio: no es necesario un identificador","Al menos 3 identificadores diferentes"],"explanation":"Se requieren dos identificadores del paciente (nombre, fecha de nacimiento) para verificar su identidad antes de administrar medicamentos."},{"text":"¿Con qué debe compararse la etiqueta del medicamento?","choices":["Etiquetas de medicamentos similares","El Registro de Administración de Medicamentos (MAR)","No es necesario comparar la etiqueta del medicamento con nada","Tanto A como B"],"explanation":"Siempre compare las etiquetas de los medicamentos con el MAR para asegurar el medicamento correcto para el paciente correcto."},{"text":"Blue Mountain realiza la documentación de las visitas a pacientes en qué formato(s):","choices":["Documentación electrónica","El Departamento de Salud de Pensilvania prohíbe a las compañías de atención médica en el hogar realizar la documentación de las visitas a pacientes","Documentación física","Tanto A como C"],"explanation":"Blue Mountain utiliza tanto formatos de documentación electrónica como física para las visitas a pacientes."},{"text":"La documentación física se compone tanto de las Hojas de Horas de las visitas como de los Registros de Actividad de las visitas.","choices":["Verdadero","Falso"],"explanation":"La documentación física incluye tanto las hojas de horas como los registros de actividad para documentar las visitas de manera completa."},{"text": "La hija de un cliente le dice que no está contenta con cómo salió una visita. ¿Qué debe hacer primero?", "choices": ["Explicarle por qué no tiene razón", "Prometer que el problema se resolverá hoy", "Pedirle que deje de quejarse", "Escuchar con calma, no discutir ni culpar, y decirle que la oficina le dará seguimiento"], "explanation": "Escuche con calma. No discuta, no culpe ni prometa un resultado. Agradezca a la persona y dígale que la oficina le dará seguimiento."},{"text": "¿Cuándo debe informar a la oficina sobre una queja que recibe?", "choices": ["El mismo día", "Al final del mes", "Solo si la queja es grave", "Solo si el cliente se lo pide"], "explanation": "Anote quién se quejó, cuándo y qué ocurrió, e informe a la oficina el mismo día."},{"text": "Un cliente puede quejarse de su atención sin temor a castigos ni a perder servicios.", "choices": ["Verdadero", "Falso"], "explanation": "Los clientes tienen derecho a quejarse sin temor a castigos ni a perder servicios. Nunca tome represalias ni presione a un cliente para que retire una queja."},{"text": "¿Cuál de estas acciones NO está permitida cuando un cliente presenta una queja?", "choices": ["Informar a la oficina", "Agradecer al cliente por avisarle", "Presionar al cliente para que retire la queja", "Anotar los detalles"], "explanation": "Nunca tome represalias ni presione a un cliente para que retire una queja. Anote los detalles, informe a la oficina y agradezca al cliente."},{"text": "Después de que la oficina recibe una queja, ¿qué hace la agencia?", "choices": ["La archiva sin revisarla", "Espera a ver si el cliente vuelve a quejarse", "Le dice al cuidador que la resuelva solo", "La registra, averigua por qué ocurrió y la corrige"], "explanation": "La agencia registra cada queja, averigua por qué ocurrió y la corrige. Las quejas son una de las cuatro áreas que se revisan en el Plan de Gestión de Calidad anual."},{"text": "¿Cuál de estos es un incidente crítico?", "choices": ["Un cliente sufre una caída con lesión", "Un cliente cambia lo que quiere almorzar", "Un cliente le pide que mueva una silla", "Un cliente ve televisión"], "explanation": "Un incidente crítico es un evento grave que involucra a un cliente y que podría afectar su salud, seguridad o derechos. Ejemplos: una caída con lesión, una visita al hospital o a emergencias, sospecha de abuso, negligencia o explotación, un cliente desaparecido, una muerte, un error con medicamentos, o la intervención de la policía o los bomberos."},{"text": "Un cliente sufre una caída grave y no responde. ¿Qué hace primero?", "choices": ["Terminar primero sus tareas", "Llamar al 911, quedarse con el cliente y dar solo los primeros auxilios para los que está capacitado", "Llamar a la oficina y esperar respuesta", "Esperar a que llegue la familia"], "explanation": "Primero la emergencia: llame al 911 si hay peligro de muerte. Quédese con el cliente y dé solo los primeros auxilios para los que está capacitado. Después llame a la oficina."},{"text": "¿Cuándo debe llamar a la oficina por un incidente crítico?", "choices": ["En su próxima visita", "Solo en horario de oficina", "De inmediato, de día o de noche", "Al final de su turno"], "explanation": "Llame a la oficina de inmediato, de día o de noche. No espere al final de su turno ni a su próxima visita. La oficina hace los reportes requeridos según la política de la agencia y las normas del estado."},{"text": "¿Qué debe incluir en su nota de progreso sobre un incidente?", "choices": ["Su opinión sobre quién tiene la culpa", "Suposiciones sobre la causa", "Nada; la oficina lo escribe todo", "Los hechos: lo que vio, cuándo ocurrió y a quién avisó"], "explanation": "Escriba los hechos en las notas de progreso: lo que vio, cuándo ocurrió y a quién avisó. Sin opiniones ni suposiciones."},{"text": "Está bien retrasar o cambiar un reporte de incidente si así se evitan problemas.", "choices": ["Verdadero", "Falso"], "explanation": "Nunca oculte, retrase ni cambie un reporte de incidente. No reportar pone en riesgo a los clientes y viola la política."},{"text": "Un cliente le pide hacer una tarea que no está en el plan de cuidado. ¿Qué debe hacer?", "choices": ["Pedirle a un vecino que la haga", "No agregarla; llamar primero a la oficina", "Hacerla si es rápida", "Hacerla y anotarla después"], "explanation": "Haga solo las tareas del plan de cuidado del cliente, en el tipo, cantidad, frecuencia y duración autorizados. No agregue ni omita tareas sin llamar a la oficina."},{"text": "¿Cómo se usa la verificación electrónica de visitas (EVV)?", "choices": ["Registrando entrada y salida una vez por semana", "Pidiéndole al cliente que registre su salida después", "Registrando entrada y salida en cada visita desde la casa del cliente", "Registrando solo la entrada"], "explanation": "Use la verificación electrónica de visitas (EVV) en cada visita: registre su entrada y salida con la aplicación HHAeXchange o el sistema telefónico desde la casa del cliente."},{"text": "Olvidó registrar su salida. ¿Qué debe completar?", "choices": ["Nada", "Un mensaje de texto a un compañero", "Una nota a la familia del cliente", "El registro de entradas / ediciones manuales, firmado por usted, el cliente y el personal de la agencia, entregado a la oficina a más tardar el lunes a las 9 a.m."], "explanation": "Si se omite una entrada o salida, complete el registro de entradas / ediciones manuales. Debe estar firmado por usted, el cliente y el personal de la agencia, y entregarse a la oficina a más tardar el lunes a las 9 a.m."},{"text": "Firmar una hoja de horas en blanco está bien si piensa llenarla después.", "choices": ["Verdadero", "Falso"], "explanation": "Nunca firme una hoja de horas en blanco. Su firma confirma que las horas y los servicios son verdaderos y correctos."},{"text": "¿Qué debe completar antes de comenzar a trabajar con clientes?", "choices": ["Solo el cuestionario anual", "La evaluación de competencia y la capacitación única de servicios de protección (Listserv)", "Nada; puede empezar de inmediato", "Solo un curso de primeros auxilios"], "explanation": "Complete la evaluación de competencia y la capacitación única de servicios de protección (Listserv) antes de comenzar con clientes, y use su credencial con foto."},{"text": "¿Qué es el Plan de Gestión de Calidad (QMP)?", "choices": ["Un calendario de pagos", "Una política sobre uniformes", "La forma en que la agencia revisa su propia atención y sigue mejorando", "Una lista de cumpleaños de clientes"], "explanation": "El Plan de Gestión de Calidad (QMP) es la forma en que la agencia revisa su propia atención y sigue mejorando. Todos los empleados reciben capacitación sobre el plan cada año."},{"text": "¿Qué cuatro áreas revisa el plan anual?", "choices": ["Pagos, horarios, uniformes y estacionamiento", "Comidas, lavandería, compras y manejo", "Contratación, despidos, capacitación y días festivos", "Quejas, incidentes, encuestas y auditorías"], "explanation": "El plan anual revisa cuatro áreas: quejas, incidentes, encuestas y auditorías. Para cada área registra las metas del año, los hallazgos, las causas, las soluciones y las metas del próximo año."},{"text": "¿Cuál de estas es su parte en el Plan de Gestión de Calidad?", "choices": ["Reportar cada queja e incidente, llevar notas precisas y cooperar con las llamadas de calidad, las encuestas y la observación", "Guardar para sí los problemas de calidad", "Hablar con el administrador solo una vez al año", "Omitir las notas en los días ocupados"], "explanation": "Su parte: reportar cada queja e incidente, completar las visitas y las notas con precisión, y cooperar con las llamadas de calidad, las encuestas de satisfacción y la observación directa de su atención."},{"text": "El objetivo de la revisión de calidad es encontrar las causas y corregirlas, no culpar a las personas.", "choices": ["Verdadero", "Falso"], "explanation": "El objetivo es encontrar las causas y corregirlas, no culpar. Reportar con honestidad y a tiempo protege a los clientes y a usted."},{"text": "¿Quién revisa y firma el Plan de Gestión de Calidad cada año?", "choices": ["El cuidador con más visitas", "La farmacia", "El administrador", "Cada cliente"], "explanation": "El plan lo revisa y lo firma cada año el administrador. Su reporte honesto es lo que lo hace funcionar."},{"text": "¿Cuál de estos es un ejemplo de fraude?", "choices": ["Llegar cinco minutos antes", "Tomar un descanso entre visitas", "Hacerle una pregunta a su supervisor", "Anotar horas que no trabajó"], "explanation": "El fraude es mentir o falsificar registros para obtener dinero o beneficios a los que usted o la agencia no tienen derecho. Anotar horas que no trabajó es un ejemplo."},{"text": "Un cliente le ofrece un préstamo o un regalo de valor. ¿Qué debe hacer?", "choices": ["Rechazarlo con cortesía e informar a su supervisor", "Aceptarlo discretamente", "Aceptarlo si la familia está de acuerdo", "Pedir más"], "explanation": "Nunca pida dinero a los clientes. Rechace con cortesía préstamos y regalos de valor, e informe a su supervisor si un cliente o familiar se los ofrece."},{"text": "Puede quedarse con la tarjeta de débito y el PIN de un cliente para hacerle las compras.", "choices": ["Verdadero", "Falso"], "explanation": "Maneje el dinero del cliente solo como lo permite el plan de cuidado. Guarde los recibos, devuelva el cambio y nunca se quede con la tarjeta de débito ni el PIN del cliente."},{"text": "Nota que falta dinero en la casa de un cliente. ¿Qué debe hacer?", "choices": ["Reponerlo usted mismo", "Preguntarles a los vecinos", "Informarlo a la oficina", "No decir nada"], "explanation": "Reporte el dinero o los bienes que falten, la actividad bancaria inusual, o a cualquier persona que presione a un cliente para firmar documentos."},{"text": "¿Qué puede pasar si falsifica horas o servicios?", "choices": ["Nada", "Una nota de agradecimiento", "Pago extra", "El despido y la remisión a las autoridades estatales y federales"], "explanation": "Falsificar horas o servicios puede llevar al despido y a la remisión a las autoridades estatales y federales."}];

                document.getElementById('printBtn').addEventListener('click', () => window.print());
                document.getElementById('restartBtn').addEventListener('click', restartQuiz);
                document.getElementById('reviewBtn').addEventListener('click', function(){window.__missedOnly=false;state.review=true;render();});wireOnb();
                var mb=document.getElementById('missedBtn');if(mb)mb.addEventListener('click', function(){window.__missedOnly=true;state.review=true;render();});
                return;
            }

            const q = questions[state.currentQuestion];
            const progress = ((state.currentQuestion + 1) / questions.length) * 100;
            
            let choicesHtml = '';
            q.choices.forEach((choice, index) => {
                let btnClass = 'choice-btn';
                let icon = '';
                
                if (state.showFeedback) {
                    if (index === q.correctIndex) {
                        btnClass += ' correct';
                        icon = ' ✓';
                    } else if (index === state.selectedAnswer) {
                        btnClass += ' incorrect';
                        icon = ' ✗';
                    }
                } else if (index === state.selectedAnswer) {
                    btnClass += ' selected';
                }
                
                var isAgain = state.showFeedback && index === state.selectedAnswer;
                if (isAgain) btnClass += ' again';
                var lastQ = state.currentQuestion >= questions.length - 1;
                choicesHtml += `<button class="${btnClass}" data-index="${index}" ${state.showFeedback && !isAgain ? 'disabled' : ''}>${choice}${icon}${isAgain ? '<span class="again-hint">' + (lastQ ? t('finish') : t('next')) + ' &rarr; (click here again or press Enter)</span>' : ''}</button>`;
            });

            let feedbackHtml = '';
            if (state.showFeedback) {
                const isCorrect = state.selectedAnswer === q.correctIndex;
                feedbackHtml = `
                    <div class="feedback ${isCorrect ? 'correct' : 'incorrect'}">
                        <div class="feedback-title">${isCorrect ? '✓ ' + t('correct') : '✗ ' + t('incorrect')}</div>
                        <div>${q.explanation}</div>${manualLinkHtml(q)}
                    </div>
                `;
            }

            app.innerHTML = `
                <div class="container">
                    <div class="quiz-card">
                        <div class="progress-text">
                            <span>${t('question')} ${state.currentQuestion + 1} ${t('of')} ${questions.length}</span>
                            <span>${t('pct')}: ${qstats().pct}</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" style="width: ${progress}%"></div>
                        </div>
                        <div class="score-line">${qstats().line}</div>
                        <h2>${q.text}</h2>
                        <div id="choices">${choicesHtml}</div>
                        ${feedbackHtml}
                        <button id="nextBtn" class="next-btn" ${!state.showFeedback ? 'disabled' : ''}>
                            ${state.currentQuestion < questions.length - 1 ? t('next') : t('finish')}
                        </button>
                        ${TOKEN ? '<div id="exitBox" style="margin-top:10px"><button id="exitBtn" type="button" style="display:block;width:100%;margin-top:10px;background:#fffbeb;border:2px solid #d97706;color:#92400e;border-radius:8px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer">'+t('exitBtn')+'</button><p style="margin:6px 0 0;text-align:center;font-size:12px;color:#6b7280">'+(LANG==='es'?'Su progreso se guarda y puede continuar m\u00e1s tarde con el mismo enlace.':'Your progress is saved so you can finish later using the same link.')+'</p></div>' : ''}
                        </div>
                                    </div>
            `;
            
            // Add event listeners after rendering
            document.querySelectorAll('.choice-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    var ix = parseInt(this.getAttribute('data-index'));
                    if (!state.showFeedback) {
                        handleAnswer(ix);
                    } else if (ix === state.selectedAnswer && Date.now() - (state.answeredAt || 0) > 700) {
                        handleNext();
                    }
                });
            });
            
            document.getElementById('nextBtn').addEventListener('click', handleNext);
            var xb=document.getElementById('exitBtn'); if(xb) xb.addEventListener('click', function(){
                var bx=document.getElementById('exitBox');
                bx.innerHTML='<div style="display:inline-block;max-width:420px;padding:14px 16px;border:2px solid #d97706;border-radius:8px;background:#fffbeb;color:#78350f"><p style="margin:0 0 12px">'+t('exitAsk')+'</p><button id="exitYes" style="background:#d97706;color:#fff;border:0;border-radius:6px;padding:8px 14px;margin-right:8px;cursor:pointer">'+t('exitYes')+'</button><button id="exitNo" style="background:#fff;color:#78350f;border:1px solid #d97706;border-radius:6px;padding:8px 14px;cursor:pointer">'+t('exitNo')+'</button></div>';
                document.getElementById('exitYes').addEventListener('click', saveAndExit);
                document.getElementById('exitNo').addEventListener('click', function(){render();});
            });
        }

        function saveAndExit(){
            var xb=document.getElementById('exitYes'); if(xb){xb.disabled=true;xb.textContent=t('exitSaving');}
            progSave();
            srvFlush(function(ok){
                var n=Math.min(questions.length,state.currentQuestion+1);
                document.getElementById('app').innerHTML='<div class="container"><div class="quiz-card" style="text-align:center"><h2>'+(ok?t('exitHead'):t('exitHead'))+'</h2><p style="margin:14px 0">'+t('exitMsg').replace('{n}',n).replace('{t}',questions.length)+'</p>'+(ok?'':'<p style="color:#b45309;font-size:13px">'+(LANG==='es'?'No se pudo guardar en el servidor, pero su progreso está guardado en este dispositivo. Use el mismo dispositivo para continuar.':'We could not reach the server, but your progress is saved on this device. Please use this same device to continue.')+'</p>')+onbBtn()+'</div></div>';
                wireOnb();
            });
        }

        function handleAnswer(index) {
            if (state.showFeedback) return;
            
            state.selectedAnswer = index;
            state.answeredAt = Date.now();
            state.showFeedback = true;
            
            state.answers[state.currentQuestion] = {
                selected: index,
                correct: index === questions[state.currentQuestion].correctIndex
            };
            progSave();
            
            render();
            try { var nb=document.getElementById('nextBtn'); if(nb){ nb.focus({preventScroll:true}); nb.scrollIntoView({block:'nearest',behavior:'smooth'}); } } catch(e) {}
        }

        function handleNext() {
            if (state.currentQuestion < questions.length - 1) {
                state.currentQuestion++;
                state.showFeedback = false;
                state.selectedAnswer = null;
                progSave();
            } else {
                if (TOKEN) { state.participantName = APP_NAME || 'Applicant'; state.quizComplete = true; submitResults(); state.showNameInput = false; } else { state.showNameInput = true; }
            }
            render();
        }

        function finishQuiz() {
            const input = document.getElementById('nameInput');
            if (input) {
                state.participantName = input.value.trim();
            }
            
            if (state.participantName) {
                state.quizComplete = true;
                submitResults();
                state.showNameInput = false;
                render();
            } else {
                alert(t('needName'));
            }
        }

        function qstats() {
            var a = Object.values(state.answers).filter(function (x) { return x && x.selected !== undefined && x.selected !== null; });
            var n = a.length, c = a.filter(function (x) { return x.correct; }).length, tot = questions.length;
            var es = (typeof LANG !== 'undefined' && LANG === 'es');
            var pct = n ? Math.round(c / n * 100) + '%' : '\u2014';
            var line = n ? (c + (es ? ' de ' : ' of ') + n + (es ? ' respondidas correctamente' : ' answered correctly') + ' \u00b7 ' + (tot - n) + (es ? ' preguntas restantes' : ' questions remaining'))
                         : ((tot) + (es ? ' preguntas restantes' : ' questions remaining'));
            return { pct: pct, line: line };
        }

        function calculateScore() {
            const correct = Object.values(state.answers).filter(a => a.correct).length;
            return {
                correct: correct,
                total: questions.length,
                percentage: Math.round((correct / questions.length) * 100)
            };
        }

        function restartQuiz() { progClear(); window.__started=true; reshuffle(); applyLang();
            state = {
                currentQuestion: 0,
                answers: {},
                showFeedback: false,
                selectedAnswer: null,
                participantName: '',
                showNameInput: false,
                quizComplete: false
            };
            render();
        }

        // Initial render
        render();
    </script>
</body>
</html>
