    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
        .container { min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; }
        .quiz-card { max-width: 800px; margin: 0 auto; background: white; border-radius: 12px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .progress-bar { width: 100%; height: 8px; background: #e5e7eb; border-radius: 4px; margin-bottom: 30px; }
        .progress-fill { height: 100%; background: #667eea; border-radius: 4px; transition: width 0.3s; }
        .score-line { margin:-18px 0 22px; color:#374151; font-size:14px; font-weight:600; }
        .progress-text { display: flex; justify-content: space-between; margin-bottom: 10px; color: #6b7280; font-size: 14px; }
        h2 { font-size: 24px; margin-bottom: 24px; color: #1f2937; line-height: 1.4; }
        .choice-btn { 
            width: 100%; 
            padding: 16px; 
            margin-bottom: 12px; 
            border: 2px solid #d1d5db; 
            background: white; 
            border-radius: 8px; 
            cursor: pointer; 
            text-align: left; 
            font-size: 16px; 
            transition: all 0.2s;
            display: block;
        }
        .choice-btn:hover:not(:disabled) { border-color: #667eea; background: #f3f4f6; transform: translateY(-2px); }
        .choice-btn:active:not(:disabled) { transform: translateY(0); }
        .choice-btn.selected { border-color: #667eea; background: #eef2ff; }
        .choice-btn.correct { border-color: #10b981; background: #d1fae5; }
        .choice-btn.incorrect { border-color: #ef4444; background: #fee2e2; }
        .choice-btn:disabled { cursor: not-allowed; opacity: 0.6; }
        .choice-btn.again { cursor: pointer; }
        .choice-btn.again:hover:not(:disabled) { transform: none; }
        .choice-btn .again-hint { display: block; margin-top: 6px; font-size: 0.85em; font-weight: 700; color: #4338ca; }
        .feedback { padding: 16px; margin: 20px 0; border-radius: 8px; }
        .feedback.correct { background: #d1fae5; border-left: 4px solid #10b981; color: #065f46; }
        .feedback.incorrect { background: #fee2e2; border-left: 4px solid #ef4444; color: #991b1b; }
        .feedback-title { font-weight: bold; margin-bottom: 8px; }
        .next-btn { width: 100%; padding: 16px; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .next-btn:hover:not(:disabled) { background: #5568d3; transform: translateY(-2px); }
        .next-btn:active:not(:disabled) { transform: translateY(0); }
        .next-btn:focus, .next-btn:focus-visible { outline: 4px solid #f59e0b; outline-offset: 3px; }
        .next-btn:disabled { background: #d1d5db; cursor: not-allowed; }
        .name-input { width: 100%; padding: 16px; border: 2px solid #d1d5db; border-radius: 8px; font-size: 16px; margin: 20px 0; }
        .certificate { max-width: 900px; margin: 0 auto; background: white; border-radius: 12px; padding: 60px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .cert-border { border: 8px double #667eea; padding: 40px; }
        .cert-title { font-size: 48px; color: #667eea; margin: 20px 0; font-weight: bold; }
        .cert-name { font-size: 32px; border-bottom: 2px solid #d1d5db; display: inline-block; padding: 0 40px 10px; margin: 20px 0; }
        .cert-score { font-size: 64px; font-weight: bold; margin: 20px 0; }
        .cert-pass { color: #10b981; }
        .cert-fail { color: #f59e0b; }
        .btn-group { margin-top: 30px; }
        .btn { padding: 12px 24px; margin: 0 10px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: all 0.2s; }
        .btn:hover { transform: translateY(-2px); }
        .btn:active { transform: translateY(0); }
        .btn-primary { background: #667eea; color: white; }
        .btn-secondary { background: #6b7280; color: white; }
        .logo { max-width: 200px; height: auto; margin: 0 auto 20px; display: block; }
        @media print {
            .btn-group { display: none; }
            .container { background: white; }
        }
        @media (max-width: 640px) {
            .quiz-card { padding: 20px; }
            h2 { font-size: 20px; }
            .cert-title { font-size: 32px; }
            .cert-name { font-size: 24px; }
            .cert-score { font-size: 48px; }
        }

.review{max-width:900px;margin:0 auto;background:#fff;border-radius:12px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,.3)}.review-head{text-align:center;margin-bottom:16px}.rv-title{margin:10px 0;color:#2b2a6b}.rv-meta{display:flex;flex-wrap:wrap;gap:6px 24px;justify-content:center;font-size:15px}.rv-q{border-left:5px solid #10b981;padding:8px 12px;margin:10px 0;border-radius:4px;background:#f9fafb;font-size:15px;break-inside:avoid;page-break-inside:avoid}.rv-q.bad{border-color:#ef4444;background:#fef2f2}.rv-qt{font-weight:600;margin-bottom:4px}.rv-ex{color:#6b7280;font-size:13px;margin-top:4px}@media print{.review{box-shadow:none!important;padding:0!important;max-width:none!important}.review .cert-logo{width:150px}}
.bs-grid{column-width:150px;column-gap:18px;margin:12px 0}

.bubble{width:20px;height:20px;border:1.6px solid #374151;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#6b7280;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}

    <div id="app"></div>

    <script>
        const questions = [
            { text: 'Who has to follow HIPAA laws?', choices: ['Physicians', 'Physicians and all health care providers', 'Only supervisors and other administrators', 'All of the above'], correctIndex: 1, explanation: 'HIPAA laws apply to physicians and all health care providers who handle protected health information.' },
            { text: 'PHI stands for Personal Health Information', choices: ['True', 'False'], correctIndex: 1, explanation: 'PHI stands for Protected Health Information, not Personal Health Information.' },
            { text: 'Examples of PHI include:', choices: ['Name, address, birthdate', 'Test results, medical records, diagnosis', 'Billing records, referral authorizations', 'All of the above'], correctIndex: 3, explanation: 'All of these are examples of Protected Health Information that must be kept confidential.' },
            { text: 'State and Federal law require what form(s) of PHI to remain confidential?', choices: ['Written', 'Spoken', 'Electronic', 'All of the above'], correctIndex: 3, explanation: 'All forms of PHI - written, spoken, and electronic - must remain confidential under state and federal law.' },
            { text: 'Because I have access to confidential patient information as part of my job, I can look up anyone\'s record even if they are not my patient, as long as I keep the information to myself', choices: ['True', 'False'], correctIndex: 1, explanation: 'You can only access patient information if it is necessary for your job duties. Unauthorized access violates HIPAA.' },
            { text: 'You can protect patient information by:', choices: ['Protecting verbal or written information', 'Utilizing safe computing skills', 'Reporting suspected security incidents', 'All of the above'], correctIndex: 3, explanation: 'All of these methods are important for protecting patient information.' },
            { text: 'The patients have the right to be informed about the health care choices that they have', choices: ['True', 'False'], correctIndex: 0, explanation: 'Patients have the right to informed consent and must be told about their healthcare options.' },
            { text: 'Which of the patient\'s beliefs must be respected?', choices: ['Cultural', 'Spiritual', 'Psychosocial', 'All of the above'], correctIndex: 3, explanation: 'All patient beliefs - cultural, spiritual, and psychosocial - must be respected as part of patient-centered care.' },
            { text: 'How must the patient be informed of their care choices?', choices: ['Orally', 'In writing', 'Don\'t need to inform', 'Both A and B'], correctIndex: 3, explanation: 'Patients can be informed orally and in writing to ensure they understand their care options.' },
            { text: 'The patient:', choices: ['Must participate in experimental treatments', 'Can never participate in experimental treatments', 'May refuse experimental treatments and/or participate in research', 'Cannot refuse treatment'], correctIndex: 2, explanation: 'Patients have the right to choose whether to participate in experimental treatments or research.' },
            { text: 'What % of seniors prefer to remain in their own homes as they age?', choices: ['30%', '50%', '75%', '90%'], correctIndex: 3, explanation: 'Approximately 90% of seniors prefer to age in place and remain in their own homes.' },
            { text: 'Which of the following is not critical to living independently?', choices: ['Physical strength', 'Vacationing', 'Preparing food', 'Transportation outside of the home'], correctIndex: 1, explanation: 'While vacationing is enjoyable, it is not critical to maintaining independent living like food preparation and transportation.' },
            { text: 'What is the most important part of the independent living philosophy:', choices: ['Patients make their own decisions', 'Active involvement in community', 'Selection of food preferences'], correctIndex: 0, explanation: 'The core of independent living is patient autonomy and the ability to make their own decisions.' },
            { text: 'What does ADL stand for?', choices: ['Activities of Daily Living', 'Autonomic Device Lens', 'Automatic Digital LED'], correctIndex: 0, explanation: 'ADL stands for Activities of Daily Living, which are basic self-care tasks.' },
            { text: 'What is the technical term for walking?', choices: ['Ambulancing', 'Ambulating', 'Anticipating'], correctIndex: 1, explanation: 'Ambulating is the medical term for walking or moving around.' },
            { text: 'Which of the following is an IADL', choices: ['Managing finances', 'Transportation', 'Shopping', 'All of the above'], correctIndex: 3, explanation: 'All of these are Instrumental Activities of Daily Living (IADLs), which are more complex than basic ADLs.' },
            { text: 'ADLs and IADLs are important for independent living', choices: ['True', 'False'], correctIndex: 0, explanation: 'Both ADLs and IADLs are essential indicators of a person\'s ability to live independently.' },
            { text: 'Which of the following is an ADL', choices: ['Using the remote', 'Sneezing', 'Bathing'], correctIndex: 2, explanation: 'Bathing is a basic Activity of Daily Living. Using a remote and sneezing are not ADLs.' },
            { text: 'What do ADLs and IADLs help assess?', choices: ['Intelligence', 'Function', 'Strength'], correctIndex: 1, explanation: 'ADLs and IADLs help assess a person\'s functional ability to care for themselves.' },
            { text: 'What are some signs that could indicate deteriorating health?', choices: ['Worsening memory', 'Inability to communicate', 'Deteriorating visual perception', 'All of the above'], correctIndex: 3, explanation: 'All of these can be signs of declining health that require attention.' },
            { text: 'Becoming flat and emotionless is a cause for concern', choices: ['True', 'False'], correctIndex: 0, explanation: 'A flat affect or loss of emotional expression can indicate depression or other health issues.' },
            { text: 'Difficulty with eating can be seen through:', choices: ['Sniffling', 'Trouble swallowing', 'Playing with silverware'], correctIndex: 1, explanation: 'Trouble swallowing (dysphagia) is a serious sign that indicates difficulty with eating.' },
            { text: 'What type of patients are most at risk for degenerative signs', choices: ['Young', 'Middle Aged', 'Elderly'], correctIndex: 2, explanation: 'Elderly patients are at highest risk for degenerative health signs.' },
            { text: 'Slurred speech is an indicator of deteriorated', choices: ['Communication', 'Breathing', 'Planning'], correctIndex: 0, explanation: 'Slurred speech indicates deterioration in communication abilities and may signal serious conditions.' },
            { text: 'Your client is eating lunch when you arrive at their home and you must take their vital signs and assist them in and out of the bathtub, what should you do?', choices: ['Tell them to finish their lunch later since you have 3 patients later today', 'Allow them to finish lunch, and then finish the bath and take vital signs last', 'Allow them to finish lunch, rest for >10 minutes, take vital signs and then bathe'], correctIndex: 2, explanation: 'Vital signs should be taken after allowing time for digestion to rest for accurate readings, then bathing can follow.' },
            { text: 'A patient tells you she is very upset with you and demands you to tell her the supervisor\'s name so they can call and report you, you should:', choices: ['Tell her you are doing the best you can', 'Leave her home and go to the next patient', 'Refuse to see her again', 'Give them the supervisor\'s name and phone number'], correctIndex: 3, explanation: 'Patients have the right to file complaints. You should provide supervisor contact information professionally.' },
            { text: 'You should take a patient difficult behavior personally', choices: ['True', 'False'], correctIndex: 1, explanation: 'Difficult behavior often stems from illness, loss of control, or frustration - not from personal issues with you.' },
            { text: 'Frustration from patients often stems from', choices: ['The phone not working', 'Not being able to eat their favorite food', 'Loss of control over their lives'], correctIndex: 2, explanation: 'Patient frustration typically comes from feeling they have lost control over their own lives and decisions.' },
            { text: 'What should you say in response to frustration?', choices: ['"What\'s making you feel so bad?"', '"It\'s no big deal."', '"This doesn\'t really matter."'], correctIndex: 0, explanation: 'Asking open-ended questions shows empathy and helps identify the source of frustration.' },
            { text: 'You should give the patient a chance to be in control', choices: ['True', 'False'], correctIndex: 0, explanation: 'Allowing patients choices and control helps maintain dignity and reduces frustration.' },
            { text: 'Changing the bed linens of a client with rash without wearing gloves is what form of transmission?', choices: ['Airborne', 'Blood Borne', 'Contact', 'Droplet'], correctIndex: 2, explanation: 'Direct contact with contaminated surfaces without gloves is contact transmission.' },
            { text: 'Keeping a fan blowing and the door open when a client has shingles is what form of transmission?', choices: ['Airborne', 'Blood borne', 'Contact', 'Droplet'], correctIndex: 0, explanation: 'Shingles can spread through airborne particles, so circulating air increases airborne transmission risk.' },
            { text: 'A client who has a cold sneezes on other at her table, what form of transmission?', choices: ['Airborne', 'Blood borne', 'Contact', 'Droplet'], correctIndex: 3, explanation: 'Sneezing spreads germs through large droplets that travel short distances.' },
            { text: 'Wiping urine off the floor without gloves, what form of transmission?', choices: ['Airborne', 'Blood borne', 'Contact', 'Droplet'], correctIndex: 2, explanation: 'Direct contact with bodily fluids without protective equipment is contact transmission.' },
            { text: 'Good hand washing technique is important because:', choices: ['It prevents the spread of germs', 'It is required by the health department', 'It is good for the patient\'s morale'], correctIndex: 0, explanation: 'Hand washing is the most effective way to prevent the spread of infectious germs.' },
            { text: 'The perineal is washed:', choices: ['From front to back', 'From back to front', 'It doesn\'t matter'], correctIndex: 0, explanation: 'Washing front to back prevents contamination and reduces infection risk.' },
            { text: 'When handling dirty linens and clothing it is best to:', choices: ['Put the dirty linens and clothing on the floor', 'Shake the linens and clothing before washing them', 'Place dirty linens and clothing in clothes hamper or plastic bag until they can be washed'], correctIndex: 2, explanation: 'Containing dirty linens prevents contamination and germ spread.' },
            { text: 'When considering the home health aide\'s role in reducing the spread of germs, the home health aide would do all of the following except:', choices: ['Cover nose and mouth when sneezing or coughing', 'Go to work even when you are ill', 'Wash hands after handling soiled items such as linens, clothing, garbage, etc.', 'To protect self, clean and cover cuts and breaks in the skin'], correctIndex: 1, explanation: 'Working while ill spreads germs to vulnerable patients. Stay home when sick.' },
            { text: 'What is the most effective disease prevention method', choices: ['Face mask', 'Cleaning clothes', 'Hand hygiene'], correctIndex: 2, explanation: 'Hand hygiene is the single most effective method of preventing disease transmission.' },
            { text: 'Approximately how long should you wash your hands for', choices: ['5-10 seconds', '20-30 seconds', '40-60 seconds', '80-120 seconds'], correctIndex: 2, explanation: 'Proper hand washing requires 40-60 seconds to effectively remove germs.' },
            { text: 'Gloves should be used in the following situation(s)', choices: ['Touching blood', 'Interacting with bodily fluids', 'Touching non-intact skin', 'All of the above'], correctIndex: 3, explanation: 'Gloves protect against all forms of potentially infectious materials.' },
            { text: 'Who should comply with infection control practices', choices: ['Care providers', 'Patients', 'Visitors', 'All of the Above'], correctIndex: 3, explanation: 'Everyone in the healthcare environment must follow infection control practices.' },
            { text: 'What tends to be the most germ-ridden spot in a household', choices: ['Basement', 'Kitchen', 'Bathrooms', 'Bedrooms'], correctIndex: 2, explanation: 'Bathrooms have the highest concentration of germs due to moisture and bodily functions.' },
            { text: 'What triggers asthma related illnesses?', choices: ['Dust', 'Pet dander', 'Mold', 'All of the Above'], correctIndex: 3, explanation: 'All of these environmental factors can trigger asthma attacks.' },
            { text: 'Cockroaches carry numerous bacteria and parasites that have germs which can cause', choices: ['HIV', 'Tuberculosis', 'Lupus', 'Gastroenteritis'], correctIndex: 3, explanation: 'Cockroaches carry bacteria that can cause gastroenteritis and other digestive illnesses.' },
            { text: 'A chaotic physical environment may promote a unhealthy diet:', choices: ['True', 'False'], correctIndex: 0, explanation: 'Disorganized environments can lead to poor food choices and unhealthy eating habits.' },
            { text: 'What is unique about the Home Care environment in regards to emergencies?', choices: ['Patient interaction', 'Meal preparation', 'Each setting is different', 'Client Independence'], correctIndex: 2, explanation: 'Home care environments vary widely, requiring flexible emergency planning for each unique setting.' },
            { text: 'A power failure would be considered an emergency', choices: ['True', 'False'], correctIndex: 0, explanation: 'Power failures can be emergencies, especially for patients dependent on medical equipment.' },
            { text: 'Emergency plans are not based upon your specific region', choices: ['True', 'False'], correctIndex: 1, explanation: 'Emergency plans must be tailored to regional risks like hurricanes, earthquakes, or extreme weather.' },
            { text: 'What are some considerations for an emergency plan', choices: ['Supplies', 'Utilities', 'Transportation', 'All of the above'], correctIndex: 3, explanation: 'Comprehensive emergency planning includes all these critical elements.' },
            { text: 'What is the most important phase during an emergency response', choices: ['Planning', 'Initial Steps', 'Recovery'], correctIndex: 1, explanation: 'The initial response steps are critical for safety and preventing further harm.' },
            { text: 'Client education is factor to consider in your response', choices: ['True', 'False'], correctIndex: 0, explanation: 'Educating clients about emergency procedures ensures they can respond appropriately.' },
            { text: 'If you know of, or suspect, abuse or neglect of an elderly person, you should first:', choices: ['Confront the staff member or family member that you suspect of doing the abuse', 'Call the state agency that accepts abuse reports', 'Report it to your supervisor'], correctIndex: 2, explanation: 'Always report suspected abuse to your supervisor first, who will follow proper reporting protocols.' },
            { text: 'Some causes of abuse and neglect are:', choices: ['Caregiver stress', 'Emotional or mental illness', 'Alcohol or drug use', 'All of the above'], correctIndex: 3, explanation: 'All of these factors can contribute to abusive situations.' },
            { text: 'Threatening an elderly person with punishment for not doing what you tell them is:', choices: ['Acceptable if done with a soft tone of voice', 'Verbal abuse, and never acceptable', 'Useful in disciplining an older person'], correctIndex: 1, explanation: 'Threats are verbal abuse regardless of tone and are never acceptable.' },
            { text: 'Exploitation is a form of abuse that involves:', choices: ['Physical harm', 'Emotional harm', 'Misuse or theft of money, property, or other financial assets'], correctIndex: 2, explanation: 'Financial exploitation involves misusing or stealing an elder\'s money or property.' },
            { text: 'Some good ways to help prevent abuse are:', choices: ['Education, counseling, and support groups', 'Listening, teaching, caregiving skills, and communicating', 'All of the above', 'None of the above'], correctIndex: 2, explanation: 'Prevention requires multiple approaches including education, support, and communication.' },
            { text: 'Symptoms of possible abuse include the following:', choices: ['Dementia', 'Increased time reading', 'Bruises or burns'], correctIndex: 2, explanation: 'Unexplained bruises or burns are physical signs of possible abuse.' },
            { text: 'Improper use of bedrails or other restraints is considered:', choices: ['Physical abuse', 'Rights violation', 'Emotional abuse'], correctIndex: 1, explanation: 'Improper restraint use violates patient rights and freedom.' },
            { text: 'Characteristics of elderly people who are likely to be financially abused include:', choices: ['They may be lonely', 'They may have mental and/or physical disabilities', 'They may have lost someone recently', 'All of the above'], correctIndex: 3, explanation: 'All these vulnerabilities make elderly people targets for financial exploitation.' },
            { text: 'Which of the following are NOT a reason as to why the elderly are attractive targets for financial abuse', choices: ['The elderly may be embarrassed to go to authorities', 'Older people tend to have more wealth than younger people', 'Older individuals visit financial institutions substantially more than young adults', 'The elderly may be severely debilitated so that they aren\'t likely to take actions against the perpetrators.'], correctIndex: 2, explanation: 'Frequency of bank visits is not a primary reason for targeting elderly victims.' },
            { text: 'Financial Exploitation can be prevented by having a trusted lawyer manage the individual\'s funds or by a family member being in charge of how the funds are allotted', choices: ['True', 'False'], correctIndex: 0, explanation: 'Having trusted oversight of finances helps protect vulnerable elderly from exploitation.' },
            { text: 'Which of the following is NOT a reason why seniors are susceptible to malnutrition:', choices: ['Metabolism and appetite slows down with age', 'Bone density decreases considerably', 'Less caloric intake means less opportunity for nutrients', 'The body\'s ability to absorb nutrients (especially specific important nutrients) decreases with age'], correctIndex: 1, explanation: 'While bone density decreases with age, it is not a direct cause of malnutrition.' },
            { text: 'What affects up to 15% of adults over age 60?', choices: ['Chicken Pox', 'Malaria', 'Vitamin B12 deficiency', 'Type 2 Diabetes'], correctIndex: 2, explanation: 'Vitamin B12 deficiency is common in older adults, affecting up to 15%.' },
            { text: 'Low levels of Omega 3 Fatty Acids can cause', choices: ['Memory Loss', 'Reduced immune function', 'Insomnia', 'Both A and B'], correctIndex: 3, explanation: 'Omega-3 deficiency can lead to both memory problems and weakened immunity.' },
            { text: 'Food selection should be low in', choices: ['Fat', 'Saturated Fat', 'Cholesterol', 'All of the above'], correctIndex: 3, explanation: 'Healthy diets should be low in fat, saturated fat, and cholesterol.' },
            { text: 'Convenience foods should be avoided', choices: ['True', 'False'], correctIndex: 0, explanation: 'Convenience foods are often high in sodium, preservatives, and low in nutrients.' },
            { text: 'Poor appetite can be explained by', choices: ['Satisfaction with food', 'Proper chewing', 'Illness', 'Mood swings'], correctIndex: 2, explanation: 'Illness is a common cause of poor appetite in patients.' },
            { text: 'The patient should be involved in the planning of meals', choices: ['True', 'False'], correctIndex: 0, explanation: 'Including patients in meal planning respects their autonomy and preferences.' },
            { text: 'When presented food should be:', choices: ['The exact same daily', 'Selected regardless of what the patient finds tasteful', 'Varied and visually appealing'], correctIndex: 2, explanation: 'Varied, appealing presentation encourages better nutrition and eating.' },
            { text: 'Replace batteries in battery-powered and hard-wired smoke alarms at least', choices: ['Once a week', 'Once a year', 'Once a month', 'Once every 18 months'], correctIndex: 1, explanation: 'Smoke alarm batteries should be replaced at least annually for safety.' },
            { text: 'It is dangerous to wear anti-slip slippers or socks on polished hardwood floors or tiles', choices: ['True', 'False'], correctIndex: 1, explanation: 'Anti-slip footwear reduces fall risk on slippery surfaces - it is safe, not dangerous.' },
            { text: 'Refuel a generator', choices: ['While it is heated', 'Only after it has cooled', 'Either while it is heated or after it has cooled', 'There are no generators that require fuel'], correctIndex: 1, explanation: 'Refueling a hot generator can cause fires or explosions. Always wait for it to cool.' },
            { text: 'Most clients need a bath daily', choices: ['True', 'False'], correctIndex: 1, explanation: 'Bathing frequency varies by individual needs. Daily bathing is not necessary for everyone.' },
            { text: 'You should do the following when the client is bathing:', choices: ['Respect their privacy', 'Keep the room cool', 'Get supplies after the bath has started', 'Play loud music'], correctIndex: 0, explanation: 'Respecting privacy maintains dignity while ensuring safety during bathing.' },
            { text: 'People who stay in bed are at a higher risk for:', choices: ['Pressure ulcers/Bed sores', 'AIDS', 'Hepatitis', 'Influenza'], correctIndex: 0, explanation: 'Extended bed rest increases pressure ulcer risk due to prolonged pressure on skin.' },
            { text: 'You should use an electric shaver over a straight razor', choices: ['True', 'False'], correctIndex: 0, explanation: 'Electric shavers are safer and reduce the risk of cuts and bleeding.' },
            { text: 'Teeth should be cleaned how frequently', choices: ['Three times a day', 'At least once a day', 'Once every other day'], correctIndex: 1, explanation: 'Teeth should be cleaned at least daily, though more frequent cleaning is better.' },
            { text: 'Amount of assistance depends on what factors', choices: ['Age', 'Physical capability', 'Gender', 'Balance'], correctIndex: 1, explanation: 'The level of assistance needed depends primarily on the patient\'s physical capabilities.' },
            { text: 'An unpredictable patient should be assisted using', choices: ['One person assist', 'Two person assist', 'Mechanical stand'], correctIndex: 2, explanation: 'Unpredictable patients require mechanical assistance for safety of both patient and caregiver.' },
            { text: 'Moderate assistance means the patient can perform what percentage of the activity on their own', choices: ['25%', '50%', '75%'], correctIndex: 1, explanation: 'Moderate assistance means the patient performs about 50% of the activity independently.' },
            { text: 'Which factor is essential in preventing falls', choices: ['Proper footwear', 'Positive mood', 'Knee exercises'], correctIndex: 0, explanation: 'Proper footwear with good traction is essential for fall prevention.' },
            { text: 'A wheelchair transfer is what kind of assist', choices: ['Unassisted', 'One person', 'Two person', 'Mechanical stand'], correctIndex: 1, explanation: 'Standard wheelchair transfers typically require one-person assistance.' },
            { text: 'When someone has an accident', choices: ['Embarrass them', 'Get angry with them', 'Be calm and reassure them'], correctIndex: 2, explanation: 'Remaining calm and reassuring maintains dignity and reduces patient distress.' },
            { text: 'How many glasses of fluid should be consumed each day', choices: ['1-2', '3-4', '6-8', '10-12'], correctIndex: 2, explanation: 'Adults should consume 6-8 glasses of fluid daily for proper hydration.' },
            { text: 'Constipation can be reduced by high fiber foods', choices: ['True', 'False'], correctIndex: 0, explanation: 'High fiber foods promote regular bowel movements and reduce constipation.' },
            { text: 'Commodes can be cleaned with', choices: ['Household cleaners', 'Bleach', 'Cranberry juice'], correctIndex: 0, explanation: 'Standard household cleaners are appropriate for cleaning commodes.' },
            { text: 'What are different forms of medication', choices: ['Oral', 'Topical', 'Nasal', 'All of the above'], correctIndex: 3, explanation: 'Medications come in many forms including oral, topical, nasal, and others.' },
            { text: 'The individual should perform _ of the procedure as possible', choices: ['None', 'As little', 'As much'], correctIndex: 2, explanation: 'Encouraging independence, patients should do as much as safely possible.' },
            { text: 'In this situation the patient has the', choices: ['Right to bear arms', 'Right to assemble', 'Right to privacy'], correctIndex: 2, explanation: 'Patients have the right to privacy during personal care procedures.' },
            { text: 'You never need a license to administer a prescription', choices: ['True', 'False'], correctIndex: 1, explanation: 'Administering prescription medications requires proper training and authorization.' },
            { text: 'Before anything is administered you should', choices: ['Call the drug company', 'Check the drug expiration date', 'Ask the patient what normal procedures are', 'Not perform hand hygiene'], correctIndex: 1, explanation: 'Always check medication expiration dates before administration for patient safety.' },
            { text: 'What device is used to assist a patient that needs to stand from their seated position', choices: ['Rope', 'Velcro', 'Trampoline', 'Gait Belt'], correctIndex: 3, explanation: 'A gait belt provides safe support when assisting patients to stand or walk.' },
            { text: 'Never have a patient wrap their arms around your waist, instead have them wrap their arms around your neck', choices: ['True', 'False'], correctIndex: 1, explanation: 'Arms around the neck is dangerous. Patients should never grab around caregiver neck or waist.' },
            { text: 'If the patient has weakness on one side of the body (e.g., due to a CVA or stroke), place the wheelchair on', choices: ['The strong side', 'The weak side', 'It does not matter, either side is fine', 'A wheelchair should not be used if a patient is weak on one side of the body'], correctIndex: 0, explanation: 'Position wheelchair on strong side so patient can use their stronger side for transfers.' },
            { text: 'When should you administer medications to a patient', choices: ['Three hours after preparing them', '24 hours after preparing them', 'Only a doctor is allowed to administer medication', 'Immediately after preparing them'], correctIndex: 3, explanation: 'Medications should be administered immediately after preparation to ensure accuracy and safety.' },
            { text: 'Verify the individual\'s identity using', choices: ['Only one identifier', 'Two identifiers', 'Use your own judgment- an identifier is not necessary', 'At least 3 different identifiers'], correctIndex: 1, explanation: 'Two patient identifiers (name, DOB) are required to verify identity before medication administration.' },
            { text: 'What should the medication label be compared to?', choices: ['Labels of similar medication', 'The Medication Administration Record (MAR)', 'It is not necessary to compare the medication label to anything', 'Both A & B'], correctIndex: 1, explanation: 'Always compare medication labels to the MAR to ensure the right medication for the right patient.' },
            { text: 'Blue Mountain conducts patient visit documentation in what format(s):', choices: ['Electronic Documentation', 'The Pennsylvania Department of Health prohibits home healthcare companies to conduct patient visit documentation', 'Physical Documentation', 'Both A & C'], correctIndex: 3, explanation: 'Blue Mountain uses both electronic and physical documentation formats for patient visits.' },
            { text: 'Physical Documentation is comprised of both Time Sheets of visits and Activity Logs of visits.', choices: ['True', 'False'], correctIndex: 0, explanation: 'Physical documentation includes both time sheets and activity logs to record visits comprehensively.' },
            { text: "A client's daughter tells you she is unhappy with how a visit went. What should you do first?", choices: ["Explain why she is wrong", "Promise that the problem will be fixed today", "Ask her to stop complaining", "Listen calmly, do not argue or blame, and tell her the office will follow up"], correctIndex: 3, explanation: "Listen calmly. Do not argue, blame or promise a result. Thank the person and say the office will follow up." },
            { text: "When should you tell the office about a complaint you receive?", choices: ["The same day", "At the end of the month", "Only if the complaint is serious", "Only if the client asks you to"], correctIndex: 0, explanation: "Write down who complained, when, and what happened, and tell the office the same day." },
            { text: "A client can complain about their care without fear of punishment or loss of services.", choices: ["True", "False"], correctIndex: 0, explanation: "Clients have the right to complain without fear of punishment or loss of services. Never retaliate or pressure a client to drop a complaint." },
            { text: "Which of these is NOT allowed when a client makes a complaint?", choices: ["Telling the office", "Thanking the client for telling you", "Pressuring the client to drop the complaint", "Writing down the details"], correctIndex: 2, explanation: "Never retaliate or pressure a client to drop a complaint. Write down the details, tell the office, and thank the client." },
            { text: "After the office receives a complaint, what does the agency do?", choices: ["Files it without looking into it", "Waits to see if the client complains again", "Tells the caregiver to settle it alone", "Records it, finds out why it happened, and fixes it"], correctIndex: 3, explanation: "The agency records every complaint, finds out why it happened and fixes it. Complaints are one of the four areas reviewed in the annual Quality Management Plan." },
            { text: "Which of these is a critical incident?", choices: ["A client has a fall with injury", "A client changes their lunch choice", "A client asks you to move a chair", "A client watches television"], correctIndex: 0, explanation: "A critical incident is a serious event involving a client that could affect the client's health, safety or rights. Examples: a fall with injury, a hospital or emergency room visit, suspected abuse, neglect or exploitation, a missing client, a death, a medication error, or police or fire involvement." },
            { text: "A client has a serious fall and is not responding. What do you do first?", choices: ["Finish your tasks first", "Call 911, stay with the client, and give only the first aid you are trained to give", "Call the office and wait for a reply", "Wait for the family to arrive"], correctIndex: 1, explanation: "Emergency first: call 911 if life is in danger. Stay with the client and give only the first aid you are trained to give. Then call the office." },
            { text: "When should you call the office about a critical incident?", choices: ["At your next visit", "Only during office hours", "Right away, day or night", "At the end of your shift"], correctIndex: 2, explanation: "Call the office right away, day or night. Do not wait until the end of your shift or your next visit. The office makes the required reports under agency policy and state rules." },
            { text: "What belongs in your progress note about an incident?", choices: ["Your opinion about who is to blame", "Guesses about what caused it", "Nothing; the office writes it all", "The facts: what you saw, when it happened, and who you told"], correctIndex: 3, explanation: "Write the facts in the progress notes: what you saw, when it happened, and who you told. No opinions or guesses." },
            { text: "It is okay to delay or change an incident report if it will avoid trouble.", choices: ["True", "False"], correctIndex: 1, explanation: "Never hide, delay or change an incident report. Not reporting puts clients at risk and is a violation of policy." },
            { text: "A client asks you to do a task that is not on the plan of care. What should you do?", choices: ["Ask a neighbor to do it", "Do not add it; call the office first", "Do it if it is quick", "Do it and write it in the notes later"], correctIndex: 1, explanation: "Do only the tasks on the client's plan of care, in the type, amount, frequency and duration authorized. Do not add or skip tasks without calling the office." },
            { text: "How do you use electronic visit verification (EVV)?", choices: ["Clock in and out once a week", "Ask the client to clock you out later", "Clock in and out at every visit from the client's home", "Clock in only"], correctIndex: 2, explanation: "Use electronic visit verification (EVV) every visit: clock in and out with the HHAeXchange app or the phone system from the client's home." },
            { text: "You forgot to clock out. What do you complete?", choices: ["Nothing", "A text message to a coworker", "A note to the client's family", "The manual entries / edits log, signed by you, the client and agency staff, given to the office by Monday 9 a.m."], correctIndex: 3, explanation: "If a clock-in or clock-out is missed, complete the manual entries / edits log. It must be signed by you, the client and agency staff, and given to the office by Monday 9 a.m." },
            { text: "Signing a blank timesheet is fine if you plan to fill it in later.", choices: ["True", "False"], correctIndex: 1, explanation: "Never sign a blank timesheet. Your signature confirms the hours and services are true and correct." },
            { text: "What must you complete before you start work with clients?", choices: ["Only the annual quiz", "The competency evaluation and the one-time protective services (Listserv) training", "Nothing; you can start right away", "Only a first-aid class"], correctIndex: 1, explanation: "Complete the competency evaluation and the one-time protective services (Listserv) training before you start with clients, and wear your photo ID badge." },
            { text: "What is the Quality Management Plan (QMP)?", choices: ["A payroll schedule", "A policy about uniforms", "How the agency checks its own care and keeps improving", "A list of client birthdays"], correctIndex: 2, explanation: "The Quality Management Plan (QMP) is how the agency checks its own care and keeps improving. Every employee is trained on it each year." },
            { text: "Which four areas does the annual plan review?", choices: ["Pay, schedules, uniforms and parking", "Meals, laundry, shopping and driving", "Hiring, firing, training and holidays", "Complaints, incidents, surveys and audits"], correctIndex: 3, explanation: "The annual plan reviews four areas: complaints, incidents, surveys and audits. For each area it records goals for the year, findings, causes, solutions and goals for next year." },
            { text: "Which of these is your part in the Quality Management Plan?", choices: ["Report every complaint and incident, keep accurate notes, and cooperate with quality calls, surveys and observation", "Keep quality problems to yourself", "Talk to the administrator only once a year", "Skip notes on busy days"], correctIndex: 0, explanation: "Your part: report every complaint and incident, complete visits and notes accurately, and cooperate with quality calls, satisfaction surveys and direct observation of your care." },
            { text: "The aim of the quality review is to find causes and fix them, not to blame people.", choices: ["True", "False"], correctIndex: 0, explanation: "The aim is to find causes and fix them, not to blame. Honest, timely reporting protects clients and you." },
            { text: "Who reviews and signs the Quality Management Plan each year?", choices: ["The caregiver with the most visits", "The pharmacy", "The administrator", "Each client"], correctIndex: 2, explanation: "The plan is reviewed and signed each year by the administrator. Your honest reporting is what makes it work." },
            { text: "Which of these is an example of fraud?", choices: ["Arriving five minutes early", "Taking a break between visits", "Asking your supervisor a question", "Recording hours you did not work"], correctIndex: 3, explanation: "Fraud is lying or falsifying records to get money or benefits you or the agency are not entitled to. Recording hours you did not work is one example." },
            { text: "A client offers you a loan or a valuable gift. What should you do?", choices: ["Politely decline and tell your supervisor", "Accept it quietly", "Accept it if the family agrees", "Ask for more"], correctIndex: 0, explanation: "Never ask clients for money. Politely decline loans and valuable gifts, and tell your supervisor if a client or family member offers one." },
            { text: "You may keep a client's debit card and PIN to shop for them.", choices: ["True", "False"], correctIndex: 1, explanation: "Handle client money only as the plan of care allows. Keep receipts, return change, and never keep the client's debit card or PIN." },
            { text: "You notice money missing from a client's home. What should you do?", choices: ["Replace it yourself", "Ask the neighbors about it", "Report it to the office", "Say nothing"], correctIndex: 2, explanation: "Report missing money or property, unusual bank activity, or anyone pressuring a client to sign papers." },
            { text: "What can happen if you falsify time or services?", choices: ["Nothing", "A thank-you note", "Extra pay", "Termination and referral to state and federal authorities"], correctIndex: 3, explanation: "Falsifying time or services can lead to termination and referral to state and federal authorities." },
        ];
